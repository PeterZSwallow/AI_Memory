services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitrina
      POSTGRES_PASSWORD: vitrina
      POSTGRES_DB: vitrina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitrina"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://vitrina:vitrina@db:5432/vitrina
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3100:3100"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
